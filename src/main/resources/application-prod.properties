# ============================================================
#  PulseChat - PRODUCTION Configuration
#  All secrets injected via environment variables — never hardcode here!
#  Set these env vars on Railway/Render dashboard:
#  DB_URL, DB_USERNAME, DB_PASSWORD, APP_JWT_SECRET,
#  CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET,
#  APP_BASE_URL, CORS_ALLOWED_ORIGINS,
#  VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY
# ============================================================

spring.application.name=PulseChat

# ============================================================
#  SERVER
# ============================================================
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-binding-errors=never

# Speed up startup on low-power free tier
spring.main.lazy-initialization=true

# ============================================================
#  DATABASE (PostgreSQL)
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
#  JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ============================================================
#  JACKSON
# ============================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Hikari connection pool — prevent hanging on slow free-tier DB
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# ============================================================
#  JWT
# ============================================================
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=86400000
app.jwt.remember-me-expiration=604800000

# ============================================================
#  CLOUDINARY
# ============================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ============================================================
#  APP BASE URL
# ============================================================
app.base-url=${APP_BASE_URL}

# ============================================================
#  FILE UPLOAD
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================================
#  SWAGGER — DISABLED in production
# ============================================================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ============================================================
#  CORS
# ============================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ============================================================
#  LOGGING
# ============================================================
logging.level.com.vitthal.chatapp=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web.socket=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

