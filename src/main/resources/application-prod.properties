# ============================================================
#  PulseChat - PRODUCTION Configuration
#  This file is in .gitignore — safe for real credentials.
#  Fill in DB_URL, DB_USERNAME, DB_PASSWORD, APP_BASE_URL,
#  and CORS_ALLOWED_ORIGINS before deploying.
# ============================================================

spring.application.name=PulseChat

# ============================================================
#  SERVER
# ============================================================
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-binding-errors=never

# Speed up startup on low-power free tier
spring.main.lazy-initialization=true

# ============================================================
#  DATABASE (MySQL)
#  ⚠️  FILL THESE IN before deploying:
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
#  JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Hikari connection pool — prevent hanging on slow free-tier DB
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# ============================================================
#  JWT
# ============================================================
app.jwt.secret=REMOVED_SECRET
app.jwt.expiration=86400000
app.jwt.remember-me-expiration=604800000

# ============================================================
#  CLOUDINARY
#  ⚠️  Regenerate API Secret on cloudinary.com before going live!
# ============================================================
cloudinary.cloud-name=dlg4tgpkp
cloudinary.api-key=REMOVED_SECRET
cloudinary.api-secret=REMOVED_SECRET

# ============================================================
#  APP BASE URL
#  ⚠️  FILL THIS IN — your backend deployed URL:
# ============================================================
app.base-url=${APP_BASE_URL}

# ============================================================
#  FILE UPLOAD
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================================
#  SWAGGER — DISABLED in production
# ============================================================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ============================================================
#  CORS
#  ⚠️  FILL THIS IN — your frontend deployed URL:
# ============================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ============================================================
#  LOGGING
# ============================================================
logging.level.com.vitthal.chatapp=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web.socket=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# ============================================================
#  WEB PUSH (VAPID)
# ============================================================
app.vapid.public-key=REMOVED_SECRET
app.vapid.private-key=REMOVED_SECRET
app.vapid.subject=mailto:admin@pulsechat.app
