# ============================================================
#  PulseChat - Spring Boot Configuration
# ============================================================

spring.application.name=PulseChat

# ============================================================
#  SERVER
# ============================================================
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# ============================================================
#  DATABASE (MySQL)
#  TODO: Update with your MySQL credentials
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/chatapp_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
#  JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
#  JWT
#  TODO: Replace with a strong 512-bit secret key
# ============================================================
app.jwt.secret=REPLACE_WITH_A_STRONG_512BIT_SECRET_KEY_MIN_32_CHARS
app.jwt.expiration=86400000
app.jwt.remember-me-expiration=604800000

# ============================================================
#  MAIL (Gmail SMTP)
#  TODO: Replace with your Gmail credentials + App Password
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_EMAIL_ADDRESS
spring.mail.password=YOUR_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ============================================================
#  CLOUDINARY
#  TODO: Replace with your Cloudinary credentials
# ============================================================
cloudinary.cloud-name=YOUR_CLOUDINARY_CLOUD_NAME
cloudinary.api-key=YOUR_CLOUDINARY_API_KEY
cloudinary.api-secret=YOUR_CLOUDINARY_API_SECRET

# ============================================================
#  FILE UPLOAD
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ============================================================
#  SWAGGER / OPENAPI
# ============================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ============================================================
#  CORS (Allow React dev server)
# ============================================================
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ============================================================
#  LOGGING
# ============================================================
logging.level.com.vitthal.chatapp=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.socket=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============================================================
#  FRONTEND URL (for email links)
# ============================================================
app.frontend.url=http://localhost:5173
