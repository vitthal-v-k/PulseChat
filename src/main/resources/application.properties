# ============================================================
#  PulseChat - Spring Boot Configuration
# ============================================================

spring.application.name=PulseChat

# ============================================================
#  SERVER
# ============================================================
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# ============================================================
#  DATABASE (MySQL)
#  TODO: Update with your MySQL credentials
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/chatapp_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
#  JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
#  JACKSON
# ============================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ============================================================
# JWT Secret — set APP_JWT_SECRET environment variable in production
app.jwt.secret=local-dev-secret-replace-in-prod
app.jwt.expiration=86400000
app.jwt.remember-me-expiration=604800000


# ============================================================
#  CLOUDINARY
#  TODO: Replace with your Cloudinary credentials
# ============================================================
cloudinary.cloud-name=YOUR_CLOUD_NAME
cloudinary.api-key=YOUR_API_KEY
cloudinary.api-secret=YOUR_API_SECRET

# ============================================================
#  APP BASE URL
#  Used for local file fallback URLs. Change to your public
#  server URL in production (e.g. https://api.yourdomain.com)
# ============================================================
app.base-url=http://localhost:8080

# ============================================================
#  FILE UPLOAD
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ============================================================
#  SWAGGER / OPENAPI
# ============================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ============================================================
#  CORS (Allow React dev server)
# ============================================================
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ============================================================
#  ACTUATOR (Health Check)
# ============================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ============================================================
#  LOGGING
# ============================================================
logging.level.com.vitthal.chatapp=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.socket=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

